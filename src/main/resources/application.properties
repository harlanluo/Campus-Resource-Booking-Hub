# ============================================================
#  Campus Booking Hub – Application Properties
# ============================================================

spring.application.name=campus-booking-hub
server.port=8080

# -----------------------------------------------------------
# H2 Embedded Database
# -----------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:campusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------------
# H2 Console  (available at http://localhost:8080/h2-console)
# -----------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------
# SQL Initialisation  (runs schema.sql then data.sql)
# -----------------------------------------------------------
spring.sql.init.mode=always

# -----------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------
# Use 'validate' so Hibernate checks the schema without recreating it
# (schema.sql is the source of truth)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
